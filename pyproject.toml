[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-europe-geolocation"
version = "1.0.0"
description = "Reproducible sub-5M-parameter European image geolocation pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "Pillow==11.1.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
  "jupyter==1.1.1",
  "matplotlib==3.10.0",
  "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

